# Pin the Node used to run scripts. @lingui/cli 6 requires >=22.19 (it guards its
# entry point with import.meta.main); pnpm downloads this version on demand so it
# does not depend on whatever Node happens to be installed globally.
useNodeVersion: 24.19.0

# Native binary for eslint-import-resolver-typescript (via eslint-config-next).
allowBuilds:
  unrs-resolver: true
